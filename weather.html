<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App Dashboard</title>
  <link rel="stylesheet" href="weather.css" />
</head>
<body>
  <div class="overlay"></div>
  
  <div class="container">
    <div class="search-box">
      <input type="text" id="city" placeholder="Enter city..." />
      <button id="search">Search</button>
    </div>

    <div class="weather-grid">
      <!-- LEFT MAIN SECTION -->
      <div class="main-card">
        <h1 id="temp">--°</h1>
        <h2 id="condition">--</h2>
        <p id="desc">Enter a city to see weather details.</p>

        <div class="sub-info">
          <div>
            <p>🌡 Feels Like</p>
            <h3 id="feels">--°</h3>
          </div>
          <div>
            <p>💧 Humidity</p>
            <h3 id="humidity">--%</h3>
          </div>
          <div>
            <p>🌧 Precipitation</p>
            <h3 id="precip">-- mm</h3>
          </div>
          <div>
            <p>👁 Visibility</p>
            <h3 id="visibility">-- km</h3>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="side-cards">
        <div class="hourly-card">
          <h3>Hourly Forecast</h3>
          <div class="hours" id="hourly"></div>
        </div>

        <div class="stats">
          <div class="stat-box">
            <h4>UV Index</h4>
            <p id="uv">--</p>
          </div>
          <div class="stat-box">
            <h4>Wind</h4>
            <p id="wind">-- m/s</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="API.js"></script>
</body>
</html>
